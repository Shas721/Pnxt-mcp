services:
  pnxt-mcp:
    build: .
    container_name: pnxt-mcp
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=5).close()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
